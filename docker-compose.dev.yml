services:
  minio:
    image: minio/minio:latest
    container_name: collabry-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # Web console (http://localhost:9001)
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 20

  # One-shot bootstrap: creates the two buckets and makes the public one
  # anonymously readable. Exits 0 when done; safe to re-run.
  minio-init:
    image: minio/mc:latest
    container_name: collabry-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      sh -c "
        mc alias set local http://minio:9000 minioadmin minioadmin &&
        mc mb -p local/collabry-public || true &&
        mc mb -p local/collabry-private || true &&
        mc anonymous set download local/collabry-public &&
        echo 'MinIO buckets ready.'
      "

volumes:
  minio-data:

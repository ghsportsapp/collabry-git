name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch: {}

# Stop a running deploy if a newer push lands (don't queue multiple deploys).
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck:
    name: Typecheck (gate)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Prisma client is needed for typecheck; generation pulls schema only,
      # never touches the database, so no DATABASE_URL secret is needed here.
      - name: Generate Prisma client
        run: pnpm --filter @workspace/collabry exec prisma generate

      - name: Typecheck
        run: pnpm run typecheck

  deploy:
    name: Deploy on VPS
    needs: typecheck
    # Runs on the self-hosted runner installed on the VPS itself.
    # Hostinger's upstream firewall blocks inbound SSH from GitHub-hosted
    # runners (Azure IP ranges), so we use a runner the VPS owns instead.
    # The runner connects OUTBOUND to GitHub — no inbound port needed.
    runs-on: [self-hosted, linux, collabry-vps]
    timeout-minutes: 10
    steps:
      - name: Run deploy script
        run: /var/www/collabry/scripts-deploy.sh
